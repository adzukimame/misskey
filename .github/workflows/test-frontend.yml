name: Test (frontend)

on:
  push:
    branches:
      - master
      - develop
      - develop-mame
  pull_request:

permissions: {}

jobs:
  vitest:
    name: vitest (frontend)

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4.0.3
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - name: Install Corepack
      run: npm install -g corepack@latest
    - name: Enable Corepack
      run: corepack enable
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Check if lock file is not modified
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy config file
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm --filter misskey-js run build
    - name: Test
      run: pnpm --filter frontend run test-and-coverage
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./packages/frontend/coverage/coverage-final.json
        disable_search: true
        flags: frontend_vitest

  e2e:
    name: e2e (frontend)

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    services:
      postgres:
        image: postgres:15
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:7
        ports:
          - 56312:6379

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4.0.3
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - name: Install Corepack
      run: npm install -g corepack@latest
    - name: Enable Corepack
      run: corepack enable
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Check if lock file is not modified
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy config file
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm run build
    # https://github.com/cypress-io/cypress/issues/4351#issuecomment-559489091
    - name: ALSA Env
      run: echo -e 'pcm.!default {\n type hw\n card 0\n}\n\nctl.!default {\n type hw\n card 0\n}' > ~/.asoundrc
    # XXX: This tries reinstalling Cypress if the binary is not cached
    # Remove this when the cache issue is fixed
    - name: Install Cypress
      run: pnpm exec cypress install
    # Chrome 158以降ではCypress 16.3.0未満でspecの切り替え時にエラーになるため、Chromeのバージョンを固定する
    # https://github.com/cypress-io/cypress/issues/35195
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2
      id: setup-chrome
      with:
        chrome-version: 157
    # Cypress 13は"Google Chrome for Testing"のバージョンを正しく検出できず、起動に必要な引数が付与されないため、
    # --versionの出力を"Google Chrome <version>"に書き換えるラッパーを経由して起動する
    - name: Create Chrome wrapper
      id: chrome-wrapper
      env:
        CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      run: |
        wrapper="$RUNNER_TEMP/google-chrome"
        cat > "$wrapper" <<EOF
        #!/bin/sh
        if [ "\$1" = "--version" ]; then
          "$CHROME_PATH" --version | sed 's/Google Chrome for Testing/Google Chrome/'
          exit
        fi
        exec "$CHROME_PATH" "\$@"
        EOF
        chmod +x "$wrapper"
        "$wrapper" --version
        echo "chrome-path=$wrapper" >> "$GITHUB_OUTPUT"
    - name: Run Cypress
      uses: cypress-io/github-action@v7
      timeout-minutes: 15
      with:
        install: false
        start: pnpm run start:test
        wait-on: 'http://localhost:61812'
        headed: true
        browser: ${{ steps.chrome-wrapper.outputs.chrome-path }}
    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: chrome-cypress-screenshots
        path: cypress/screenshots
    - name: Upload videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: chrome-cypress-videos
        path: cypress/videos
