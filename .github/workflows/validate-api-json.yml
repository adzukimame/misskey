name: Validate api.json

on:
  push:
    branches:
      - master
      - develop
      - develop-mame
  pull_request:

permissions: {}

jobs:
  validate-api-json:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4.0.3
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - name: Install Redocly CLI
      run: npm i -g @redocly/cli
    - name: Install Corepack
      run: npm install -g corepack@latest
    - name: Enable Corepack
      run: corepack enable
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Check if lock file is not modified
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy config file
      run: cp .config/example.yml .config/default.yml
    - name: Pre-build
      run: pnpm run build-pre
    - name: Generate api.json
      run: pnpm --filter backend run generate-api-json
    - name: Validate api.json
      run: npx @redocly/cli lint --extends=minimal ./packages/backend/built/api.json
